# Fragment to merge into deploy/compose/compose.yml (or include via compose overlay).
# Prerequisites:
# - relay service uses `expose: ["3000"]` (NOT host ports 3000:3000)
# - same BUZZ_IMAGE as main relay
# - .env has BUZZ_PAIRING_RELAY_URL=wss://<public-fqdn>/pair
# - Caddyfile.pair next to this compose file

services:
  pair:
    image: ${BUZZ_IMAGE:-ghcr.io/block/buzz:main}
    entrypoint: ["/usr/local/bin/buzz-pair-relay"]
    environment:
      BUZZ_PAIR_RELAY_BIND_ADDR: 0.0.0.0:5000
    restart: unless-stopped
    networks:
      - buzz-net

  edge:
    image: caddy:2.8-alpine
    ports:
      - "${BUZZ_HTTP_PORT:-3000}:80"
    volumes:
      - ./Caddyfile.pair:/etc/caddy/Caddyfile:ro
    depends_on:
      - relay
      - pair
    restart: unless-stopped
    networks:
      - buzz-net
